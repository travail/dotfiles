name: README Drift Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-readme-drift:
    uses: travail/.github/.github/workflows/readme-drift-check.yml@issue-1-reusable-workflows
    with:
      tools-ref: issue-1-reusable-workflows
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
